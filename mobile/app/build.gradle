plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'xyz.introus.orbit'
    compileSdk 36

    defaultConfig {
        applicationId 'xyz.introus.orbit'
        minSdk 29
        targetSdk 36
        versionCode 4
        versionName '0.2.0-alpha.3'
        testInstrumentationRunner 'android.test.InstrumentationTestRunner'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def orbitAssets = tasks.register('orbitAssets', Sync) {
    from('../../renderer/wallpapers') {
        include 'seoul-*.jpg'
        into 'wallpapers'
    }
    from('../../renderer/sites') {
        include '*.png'
        into 'sites'
    }
    from('../../renderer/brand/icon-256.png') {
        rename { 'orbit.png' }
    }
    from('../../renderer/brand') {
        include 'yuwol-*.png'
        into 'brand'
    }
    into layout.buildDirectory.dir('generated/orbitAssets')
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/orbitAssets'))
tasks.named('preBuild').configure { dependsOn orbitAssets }

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    testImplementation 'junit:junit:4.13.2'
}
