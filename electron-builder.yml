appId: com.orbitbrowser.desktop
productName: Orbit
executableName: Orbit
asar: true
compression: normal
forceCodeSigning: false
npmRebuild: false
publish: []

directories:
  output: ../Orbit-release
  buildResources: build

files:
  - main.cjs
  - preload.cjs
  - login-preload.cjs
  - lib/**
  - renderer/**
  - package.json
  - README.md
  - DISTRIBUTION.md

electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

win:
  target:
    - target: dir
      arch:
        - x64
  icon: renderer/orbit.ico
  requestedExecutionLevel: asInvoker
